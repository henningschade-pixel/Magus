<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+SC:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  --ink:#141416; --panel:#232327; --panel2:#2e2e33; --line:#4d4d55; --gold:#d2ad4f; --bone:#efe6d2; --mute:#aaaab2;
  --fire:#ff7a3d; --earth:#93c24f; --water:#52a6f5; --curse:#dcdce8; --bad:#ea5a5e; --good:#7fd08a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0e10;color:var(--bone);font-family:'Alegreya',Georgia,'Times New Roman',serif;overflow:hidden}
button{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:800px;flex:none;transform-origin:center center;overflow:hidden;
  --gm:#2e2e33;--tm:#34343a;--te:#18181b;--bm:#34343a;--be:#18181b;
  background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.4) 100%),linear-gradient(180deg,var(--te) 0%,var(--tm) 20%,var(--gm) 50%,var(--bm) 80%,var(--be) 100%);border-radius:10px}
#stage[data-top=F]{--tm:#5a2a1c;--te:#2a130d}#stage[data-top=E]{--tm:#3c4f22;--te:#1a240f}#stage[data-top=W]{--tm:#20426a;--te:#0f2037}
#stage[data-bot=F]{--bm:#5a2a1c;--be:#2a130d}#stage[data-bot=E]{--bm:#3c4f22;--be:#1a240f}#stage[data-bot=W]{--bm:#20426a;--be:#0f2037}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0.3;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%273%27 height=%273%27%3E%3Crect width=%273%27 height=%273%27 fill=%27%23808080%27/%3E%3Crect width=%273%27 height=%271%27 fill=%27%23fff%27 opacity=%270.6%27/%3E%3Crect width=%271%27 height=%273%27 fill=%27%23000%27 opacity=%270.6%27/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27300%27 height=%27300%27%3E%3Cfilter id=%27f%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.9 .04%27 numOctaves=%272%27 seed=%274%27/%3E%3CfeColorMatrix values=%270 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -0.5%27/%3E%3C/filter%3E%3Crect width=%27100%%27 height=%27100%%27 filter=%27url(%23f)%27/%3E%3C/svg%3E");background-size:3px 3px,300px 300px}
.zone-line{position:absolute;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
h2,h3,.sc{font-family:'Alegreya SC','Alegreya',Georgia,serif;font-weight:700;letter-spacing:.02em;margin:0}

/* Schaltflächen, Balken, Farben */
.note{color:var(--mute);font-size:15px;line-height:1.25}
.btn{background:linear-gradient(180deg,#3d3d44,#2b2b30);border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer;font-size:18px;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#4a4a52,#34343a)}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:linear-gradient(180deg,#c79f45,#9a7a2e);color:#201505;border-color:#e6c46d;font-weight:700}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#dcb457,#aa8736)}
.btn.small{padding:3px 10px;font-size:16px}
.row{display:flex;align-items:center;gap:8px}
.statrow{display:flex;align-items:center;gap:7px;font-size:20px;margin:2px 0}
.statrow img{width:28px;height:28px;object-fit:contain}
.bar{height:8px;background:#141416;border-radius:5px;overflow:hidden;border:1px solid #44444c}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c9484c,#ea7a6d)}
.bar.mana>i{background:linear-gradient(90deg,#3d7fd0,#6cc0ff)}
.dots{letter-spacing:2px;font-size:18px}
.F{color:var(--fire)}.E{color:var(--earth)}.W{color:var(--water)}.C{color:var(--curse)}
/* Karten, Stapel */
.card{position:absolute;left:0;top:0;width:128px;height:194px;transform-origin:top left;transition:transform .42s cubic-bezier(.2,.7,.2,1),opacity .35s;will-change:transform;cursor:default}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s}
.card.down .inner{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:100% 100%;border-radius:11px;box-shadow:0 3px 9px rgba(0,0,0,.55)}
.card .face.back{transform:rotateY(180deg)}
.card.myhand{cursor:pointer}
.card.myhand:hover .face.front{filter:brightness(1.18)}
.card.marked .face.front{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(210,173,79,.65)}
.card.bad .face.front{box-shadow:0 0 0 3px var(--bad)}
.card .lockbtn{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;background:rgba(10,8,14,.78) center/60% no-repeat;border:1px solid var(--line);opacity:0;transition:opacity .15s;cursor:pointer}
.card.myhand:hover .lockbtn,.card.locked .lockbtn{opacity:1}
.card.locked .lockbtn{border-color:var(--gold);background-color:rgba(210,173,79,.28)}
.card.fadeout{opacity:0}
.slot-ph{position:absolute;width:128px;height:194px;border:2px dashed rgba(169,159,189,.28);border-radius:12px}
.pilelabel{position:absolute;font-size:15px;color:var(--mute);text-align:center;width:110px}
.pilehit{position:absolute;border-radius:12px;cursor:pointer;z-index:60}
.pilehit:hover{box-shadow:0 0 0 2px var(--gold)}
.pilehit.off{cursor:default}.pilehit.off:hover{box-shadow:none}
.freedraw{position:absolute;z-index:61;display:flex;align-items:center;gap:6px;background:rgba(10,8,14,.8);border:1px solid var(--gold);border-radius:20px;padding:2px 12px 2px 4px;cursor:pointer;font-size:17px}
.freedraw img{width:34px;height:34px;object-fit:contain}
/* Panels, Spielerstatus, Händler, Monster */
.panel{position:absolute;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:hidden}
.panel h3{font-size:20px;color:var(--gold);margin-bottom:6px}
.statrow .note{font-size:15px}
.turnflag{position:absolute;text-align:center;font-family:'Alegreya SC',serif;font-size:22px;color:var(--gold);z-index:5}
.turnflag.wait{color:var(--mute)}

/* Spielerstatus: Werte links, Magie-Board rechts */
.sbody{display:flex;gap:8px;align-items:center}.scol{flex:1;min-width:0}
.sbody .bcol{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.sbody .statrow{gap:6px;margin:3px 0}.sbody .statrow img{width:22px;height:22px}.sbody .statrow b{min-width:33px}
.bar.sb{flex:1;min-width:24px;height:9px}
.bd{position:relative;flex:none}.bd img{width:100%;height:100%;display:block}
.rg{position:absolute;border-radius:50%;box-sizing:border-box;pointer-events:none}
.rg.on{border:2.5px solid #f2c850;box-shadow:0 0 6px #f2c850aa;background:rgba(242,200,80,.18)}
.lfsel{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;flex-basis:100%}.lfsel .mini{font-size:13px;padding:2px 7px}.mini{font:700 14px Alegreya,serif;padding:2px 8px;border-radius:10px;border:1px solid #8a7a50;background:#2b2b30;color:#d8c9a0;cursor:pointer}.mini.on{background:#e8c35a;color:#2a1a05}
.mr{color:#7fd4ff;font-size:18px;font-weight:700;margin-left:8px;white-space:nowrap;cursor:help}
.mk{color:#c58cf0;letter-spacing:2px;font-size:20px}
.mkimg{width:22px;height:22px;vertical-align:middle;margin-right:2px}.mkimg.off{opacity:.22}
.sbody .statrow .mk{display:flex;flex-wrap:nowrap;gap:1px;white-space:nowrap;margin-left:0}
.sbody .statrow .mk img{width:18px;height:18px}
.sbody .statrow .plcol{margin-left:auto;display:flex}
.pendhdr{float:right;color:var(--gold);font-size:15px;font-weight:400}.pendhdr b{font-size:19px;font-weight:700}

/* Plus-Knöpfe (Upgrade-Punkte ausgeben) */
.up{width:24px;height:26px;padding:0;border:0;background:var(--plus) center/contain no-repeat;cursor:pointer;margin-left:4px;flex:none}
.up:hover{background-image:var(--plush)}
.up.costly{position:relative}
.up.costly::after{content:attr(data-c);position:absolute;right:-5px;top:-6px;min-width:15px;height:15px;border-radius:8px;background:#e8c35a;color:#2a1a05;font:700 12px/15px Alegreya,serif;text-align:center;box-shadow:0 0 0 1px #2a1a05}
.up.off{opacity:.38;cursor:default;pointer-events:auto}
.up.off:hover{background-image:var(--plus)}
.up.mg{position:absolute;margin:0;z-index:2}
.up.ph{visibility:hidden;pointer-events:none;background:none}
.upgpts{position:absolute;display:flex;align-items:center;gap:2px;color:var(--gold);font-size:28px;pointer-events:auto;z-index:70}
.upgpts img{width:34px;height:50px;object-fit:contain}

/* Opfern: Auswahl links, Knopf rechts, zusammen so lang wie die Balken */
.sacbox{flex:1;display:flex;align-items:center;justify-content:space-between;min-width:0}
.sacbox .stepper{flex:none;display:flex;align-items:center;gap:1px;justify-content:flex-start;font-size:16px;color:var(--gold)}
.sacbox .stepper b{min-width:0;color:#fff}
.sacbox .sacbtn{margin:0;padding:0 5px;font-size:13px;line-height:20px}
.arr{background:none;border:0;color:var(--gold);font-size:12px;padding:0 1px;cursor:pointer}.arr:disabled{opacity:.3;cursor:default}.arr:hover:not(:disabled){color:#fff}

/* Monster */
.mon{position:absolute;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#2e2e33,#1f1f23);text-align:center;overflow:hidden}
.mon img.pic{object-fit:contain;display:block;margin:0 auto 2px}
.mon.dead{opacity:.55}
.mon .nm{font-family:'Alegreya SC',serif;font-size:18px}
.mon .sm{font-size:15px;color:var(--mute);line-height:1.2}
.mon .loot{color:var(--gold);font-size:16px}
.mon .btn{margin-top:4px;width:100%;padding:3px 10px}
.mon .bar{margin:3px 4px}
.magrow{display:flex;align-items:center;gap:8px;font-size:19px;margin:3px 0}
.magrow .nm{width:70px}

/* Händler */
.vrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid #44444c;border-radius:9px;margin-bottom:5px;cursor:pointer;background:rgba(0,0,0,.18)}
.vrow:hover{border-color:var(--gold)}
.vrow.off{opacity:.4;cursor:default}.vrow.off:hover{border-color:#44444c}
.thumb{width:30px;height:45px;background-size:100% 100%;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.vrow .plus{color:var(--mute);font-size:16px}
.vrow img.ar{width:26px}

/* Protokoll (Weltphase) */
#log{position:absolute;font-size:15px;color:var(--mute);line-height:1.28;pointer-events:none}
#log div{opacity:.55}#log div:last-child{opacity:1;color:var(--bone)}
#log.logpanel{padding:12px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;text-align:left;color:var(--bone)}
#log.logpanel h3{font-size:20px;color:var(--gold);margin-bottom:6px;flex:none}
#log.logpanel .logl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#log.logpanel .logl div{opacity:.62;padding:2px 0 2px 8px;border-left:2px solid transparent;line-height:1.25}
#log.logpanel .logl div.me{border-left-color:var(--gold)}#log.logpanel .logl div.op{border-left-color:var(--mute)}
#log.logpanel .logl div:last-child{opacity:1}
#log.logpanel .logst{flex:none;color:var(--mute);font-size:15px;line-height:1.3;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}

/* Kopfzeile des Spielerstatus: Name, Tempelfortschritt, Punkte, Siegpunkte (rechtsbündig) */
.hdr{display:flex;align-items:center;gap:8px;width:100%}
.hn{white-space:nowrap}
.hsp{margin-left:auto;font-weight:400;color:var(--mute);font-size:17px;white-space:nowrap}.hsp b{color:var(--gold)}
.pendhdr{float:none;white-space:nowrap}
.temple{display:flex;align-items:center;gap:5px;flex:1;min-width:0;font-family:'Alegreya',serif;font-weight:400;font-size:14px;color:var(--mute)}
.temple .tl{white-space:nowrap}
.temple .bar.sb{flex:1;min-width:20px}
.temple .tc{color:var(--gold);white-space:nowrap;font-size:14px}
.temple .tg{color:var(--good)}
.bar.tp>i{background:linear-gradient(90deg,#b8923a,#f2c850)}

.mrsel{margin-top:6px}.mrsel b{font-size:20px;margin:0 4px}
.bar.tp{position:relative}.bar.tp>i{position:absolute;left:0;top:0;bottom:0}.bar.tp>i.pre{background:repeating-linear-gradient(45deg,#6fbf73,#6fbf73 4px,#9bdca0 4px,#9bdca0 8px);opacity:.9}
.temple .bar.sb{height:12px}
.mkcol{display:inline-flex;flex-direction:column;gap:0;vertical-align:middle;line-height:1}
.mkcol .mk{display:flex;flex-wrap:nowrap;gap:1px;white-space:nowrap;margin:0}
.mkcol .mk img{width:15px;height:15px;margin:0}
.mkimg.mir{filter:hue-rotate(-95deg) saturate(1.4) brightness(1.15)}
.mkcol .mr{font-size:13px;margin:0;line-height:1.1}

.mirstack{position:absolute;display:flex;flex-direction:column;gap:4px;z-index:70}
.mtok{width:34px;height:34px;border-radius:50%;border:3px solid currentColor;display:flex;align-items:center;justify-content:center;font:700 20px Alegreya,serif;background:radial-gradient(circle at 35% 30%,#fff9 0,#ffffff22 35%,#0006 100%),#1d1d21;box-shadow:0 0 8px currentColor;cursor:help}
.mtok.F{color:var(--fire)}.mtok.E{color:var(--earth)}.mtok.W{color:var(--water)}
.mini.F.on{background:var(--fire);color:#201}.mini.E.on{background:var(--earth);color:#102}.mini.W.on{background:var(--water);color:#012}
.mlabel{cursor:help;text-decoration:underline dotted rgba(210,173,79,.5);text-underline-offset:3px}
/* Kampf */
.combatcenter{text-align:center;height:100%;display:flex;flex-direction:column}.combatcenter>*{flex:none}
.combatcenter img.big{height:96px;align-self:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.combatcenter>.preview{flex:1 1 auto;min-height:0;overflow-y:auto}.preview{min-height:44px;font-size:18px;margin:4px 0}
.preview .bad{color:var(--bad)}
.combo{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border:1px solid #44444c;border-radius:9px;margin-bottom:7px;background:rgba(0,0,0,.2);font-size:18px}
.combo.on{border-color:var(--good);background:rgba(127,208,138,.12)}
.combo small{display:block;color:var(--mute);font-size:15px}
.combo input{width:20px;height:20px;accent-color:var(--gold)}
.combatcenter>.btnrow{flex:none;padding-top:4px}.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.banner{position:absolute;z-index:120;text-align:center;background:rgba(14,10,22,.93);border:1px solid var(--gold);border-radius:14px;padding:16px 20px;font-size:21px;line-height:1.3;cursor:pointer}
.banner small{display:block;color:var(--mute);font-size:15px;margin-top:6px}

.cref{padding:2px 7px;border:1px solid #44444c;border-radius:8px;margin-bottom:3px;font-size:14px;background:rgba(255,255,255,.02)}.cref.on{border-color:var(--good);background:rgba(127,208,138,.12)}.cref small{display:block;color:var(--mute);font-size:12.5px;line-height:1.15;margin-top:0}.cref .note{font-size:13px}
/* Hinweise, Start-/Endbildschirm, Ton */
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:rgba(10,8,14,.92);border:1px solid var(--bad);border-radius:10px;padding:8px 18px;font-size:19px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.overlay{position:absolute;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(10,7,16,.78)}
.overlay .box{width:640px;max-height:740px;display:flex;flex-direction:column;box-sizing:border-box;background:linear-gradient(180deg,#2e2e33,#1d1d21);border:1px solid var(--gold);border-radius:16px;padding:28px 34px;text-align:center}
.overlay h1{font-family:'Alegreya SC',serif;font-size:56px;margin:0 0 4px;color:var(--gold);letter-spacing:.06em}
.overlay p{font-size:20px;line-height:1.35;margin:8px 0}
.overlay ul{flex:1 1 auto;min-height:0;overflow-y:auto;text-align:left;font-size:18px;color:var(--mute);line-height:1.35;padding-left:22px;margin:10px 0 18px}
#sndbtn{position:absolute;left:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,14,.7);font-size:18px;cursor:pointer;z-index:250;padding:0}#sndbtn:hover{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){.card,.card .inner{transition-duration:.01s}}

.mpbox{flex:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:17px}
.mprow{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0 4px}
.mprow input{width:96px;text-align:center;font:inherit;font-size:20px;letter-spacing:.18em;text-transform:uppercase;background:#141416;color:var(--bone);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.mprow input:focus{outline:none;border-color:var(--gold)}
#mpmsg{min-height:22px;font-size:15px}
.mpcode{font-family:'Alegreya SC',serif;font-size:64px;letter-spacing:.2em;color:var(--gold);margin:10px 0}
#mpchip{position:absolute;left:56px;top:16px;z-index:250;font-size:15px;color:var(--mute);background:rgba(10,8,14,.7);border:1px solid var(--line);border-radius:14px;padding:3px 12px;pointer-events:none}
#mpchip.off{color:var(--bad);border-color:var(--bad)}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="panels"></div><div id="ph"></div><div id="cards"></div>
  <div id="log"></div>

/* Magus – Regelkern (Teil 1): Konstanten, Zufall, Karten, Decks.

const ELEMENTS = ['F', 'E', 'W'];
const SUPERIOR = { F: 'W', W: 'E', E: 'F' };     // überlegenes Element gegen X
const NAMES = { F: 'Feuer', E: 'Erde', W: 'Wasser' };

/* ---------- Zufall (deterministisch über den Seed) ---------- */
function makeRng(seed) {
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

function parseCard(id) {

const Snd = (() => {

    if (ctx || !window.SND) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC();
      for (const k of Object.keys(window.SND)) {
        const bin = atob(window.SND[k].split(',')[1]), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        ctx.decodeAudioData(arr.buffer, b => { bufs[k] = b; }, () => {});
      }
    } catch (e) { ctx = null; }
  }
  function play(k, delay, vol) {
    if (!on || !ctx || !bufs[k]) return;
    if (ctx.state === 'suspended') ctx.resume();
    try { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = bufs[k]; g.gain.value = vol === undefined ? 0.55 : vol; s.connect(g); g.connect(ctx.destination); s.start(ctx.currentTime + (delay || 0)); } catch (e) {}
  }

    init, play, get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('magus_sound', on ? '1' : '0'); } catch (e) {} init(); return on; },
  };
})();
document.addEventListener('pointerdown', () => Snd.init(), { once: false, capture: true });
let sndQ = { flip: 0, place: 0, shuf: 0 };
function flushSound(quiet) {
  const q = sndQ; sndQ = { flip: 0, place: 0, shuf: 0 };

  for (let i = 0; i < Math.min(q.flip, 4); i++) Snd.play('flip', i * 0.09);
  for (let i = 0; i < Math.min(q.place, 4); i++) Snd.play('play', 0.05 + i * 0.09);
}

function place(card, s) {

    d.style.opacity = '0'; void d.offsetWidth; d.style.opacity = '1';

async function mpOpen(code, host) {

function onAct(d) {

    case 'spend': act({ type: 'spend', what: d.w }); break;

    case 'pass': act({ type: 'pass' }); break;

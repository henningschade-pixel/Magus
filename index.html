<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+SC:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  --cd:default; --cp:pointer;
  --ink:#141416; --panel:#232327; --panel2:#2e2e33; --line:#4d4d55; --gold:#d2ad4f; --bone:#efe6d2; --mute:#aaaab2;
  --fire:#ff7a3d; --earth:#93c24f; --water:#52a6f5; --curse:#dcdce8; --bad:#ea5a5e; --good:#7fd08a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;cursor:var(--cd);background:#0e0e10;color:var(--bone);font-family:'Alegreya',Georgia,'Times New Roman',serif;overflow:hidden}
button{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:800px;flex:none;transform-origin:center center;overflow:hidden;
  --gm:#2e2e33;--tm:#34343a;--te:#18181b;--bm:#34343a;--be:#18181b;
  background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.4) 100%),linear-gradient(180deg,var(--te) 0%,var(--tm) 20%,var(--gm) 50%,var(--bm) 80%,var(--be) 100%);border-radius:10px}
#stage[data-top=F]{--tm:#5a2a1c;--te:#2a130d}#stage[data-top=E]{--tm:#3c4f22;--te:#1a240f}#stage[data-top=W]{--tm:#20426a;--te:#0f2037}
#stage[data-bot=F]{--bm:#5a2a1c;--be:#2a130d}#stage[data-bot=E]{--bm:#3c4f22;--be:#1a240f}#stage[data-bot=W]{--bm:#20426a;--be:#0f2037}
/* Stein mit Runen: Steinkorn und eingeritzte Runen liegen über dem Elementverlauf, die Farbe des Monsters bleibt sichtbar */
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;mix-blend-mode:overlay;filter:brightness(1.5) contrast(1.35);background-image:url("assets/stein.webp");background-size:1024px 1024px}
#runes1,#runes2{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:url("assets/runen-maske.webp");mask-image:url("assets/runen-maske.webp");-webkit-mask-size:1024px 1024px;mask-size:1024px 1024px}
#runes1{background:#000;mix-blend-mode:multiply;opacity:.5;-webkit-mask-position:1px 1px;mask-position:1px 1px}
#runes2{background:#e8e1cc;mix-blend-mode:soft-light;opacity:.28;-webkit-mask-position:-1px -1px;mask-position:-1px -1px}
.zone-line{position:absolute;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
h2,h3,.sc{font-family:'Alegreya SC','Alegreya',Georgia,serif;font-weight:700;letter-spacing:.02em;margin:0}

/* Schaltflächen, Balken, Farben */
.note{color:var(--mute);font-size:15px;line-height:1.25}
.btn{background:linear-gradient(180deg,#3d3d44,#2b2b30);border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:var(--cp);font-size:18px;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#4a4a52,#34343a)}
.btn:disabled{opacity:.38;cursor:var(--cd)}
.btn.primary{background:linear-gradient(180deg,#c79f45,#9a7a2e);color:#201505;border-color:#e6c46d;font-weight:700}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#dcb457,#aa8736)}
.btn.small{padding:3px 10px;font-size:16px}
.btn.blue{background:linear-gradient(180deg,#3f7fc4,#2a568f);border-color:#6fa8e6;color:#f1f7ff}.btn.blue:hover:not(:disabled){background:linear-gradient(180deg,#4f90d6,#336aa8);border-color:#9cc6f2}
.btn.danger{background:linear-gradient(180deg,#b04a3f,#7d2d26);border-color:#e08577;color:#fff}.btn.danger:hover:not(:disabled){background:linear-gradient(180deg,#c35a4f,#8d3730)}
.fleewarn{margin-top:8px;padding:8px 12px;border:1px solid #e08577;border-radius:9px;background:rgba(125,45,38,.35);font-size:16px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.statrow{display:flex;align-items:center;gap:7px;font-size:20px;margin:2px 0}
.statrow img{width:28px;height:28px;object-fit:contain}
.bar{height:8px;background:#141416;border-radius:5px;overflow:hidden;border:1px solid #44444c}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c9484c,#ea7a6d)}
.bar.mana>i{background:linear-gradient(90deg,#3d7fd0,#6cc0ff)}
.dots{letter-spacing:2px;font-size:18px}
.F{color:var(--fire)}.E{color:var(--earth)}.W{color:var(--water)}.C{color:var(--curse)}
/* Karten, Stapel */
.card{position:absolute;left:0;top:0;width:128px;height:194px;transform-origin:top left;transition:transform .42s cubic-bezier(.2,.7,.2,1),opacity .35s;will-change:transform;cursor:var(--cd)}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s}
.card.down .inner{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:100% 100%;border-radius:11px;box-shadow:0 3px 9px rgba(0,0,0,.55)}
.card .face.back{transform:rotateY(180deg)}
.card.myhand{cursor:var(--cp)}
.card.myhand:hover .face.front{filter:brightness(1.18)}
.card.fd .face.front{box-shadow:0 0 0 3px #ff6b3d,0 0 22px rgba(255,107,61,.75)}
.card.first .face.front{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(210,173,79,.65)}
.card.bad .face.front{box-shadow:0 0 0 3px var(--bad)}
.card .lockbtn{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;background:rgba(10,8,14,.78) center/60% no-repeat;border:1px solid var(--line);opacity:0;transition:opacity .15s;cursor:var(--cp)}
.card.myhand:hover .lockbtn,.card.locked .lockbtn{opacity:1}
.card.locked .lockbtn{border-color:var(--gold);background-color:rgba(210,173,79,.28)}
.fxnote{position:absolute;z-index:260;left:920px;width:336px;box-sizing:border-box;padding:8px 14px 8px 12px;border-radius:12px;font-size:19px;line-height:1.25;pointer-events:none;display:flex;gap:10px;align-items:center;background:rgba(14,10,22,.95);border:1px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.6);animation:fxin 3.2s ease-out forwards}
.fxnote i{font-style:normal;font-size:28px;line-height:1}
.fxnote.death{border-color:#b04bd8;box-shadow:0 0 18px rgba(176,75,216,.55)}.fxnote.death i{color:#d98cf5}
.fxnote.mirror{border-color:var(--water);box-shadow:0 0 18px rgba(82,166,245,.5)}.fxnote.mirror i{color:var(--water)}
@keyframes fxin{0%{opacity:0;transform:translateY(10px) scale(.96)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.card.fadeout{pointer-events:none;z-index:400}
/* Verbrennen (Verkohlen): die Karte vergraut und dunkelt ab, steigt auf und zerfällt von unten nach oben */
.card.fadeout .inner{animation:burnash 1.2s ease-in forwards;-webkit-mask-image:linear-gradient(to top,transparent 0,transparent 40%,#000 62%,#000 100%);mask-image:linear-gradient(to top,transparent 0,transparent 40%,#000 62%,#000 100%);-webkit-mask-size:100% 193%;mask-size:100% 193%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
@keyframes burnash{0%{translate:0 0;opacity:1;filter:none;-webkit-mask-position:0 0;mask-position:0 0}
 50%{filter:grayscale(.4) brightness(.64)}
 100%{translate:0 -70px;opacity:0;filter:grayscale(.8) brightness(.28) blur(2px);-webkit-mask-position:0 100%;mask-position:0 100%}}
.pile-ph{position:absolute;border:2px dashed rgba(169,159,189,.28);border-radius:12px;pointer-events:none}
.slot-ph{position:absolute;width:128px;height:194px;border:2px dashed rgba(169,159,189,.28);border-radius:12px}
.pilelabel{position:absolute;font-size:15px;color:var(--mute);text-align:center;width:110px}
.pilehit{position:absolute;border-radius:12px;cursor:var(--cp);z-index:60}
.pilehit:hover{box-shadow:0 0 0 2px var(--gold)}
.dkpop{position:absolute;z-index:150;width:520px;box-sizing:border-box;background:rgba(14,10,22,.96);border:1px solid var(--gold);border-radius:14px;padding:14px 18px 12px;cursor:var(--cp)}
.dkpop h4{margin:0 0 8px;font-family:'Alegreya SC',serif;font-size:22px;color:var(--gold);font-weight:400}
.dkpop .dkbars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--mute);padding:0 4px}
.dkpop .dkcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.dkpop .dkbar{width:100%;max-width:44px;border-radius:4px 4px 0 0;min-height:2px}
.dkpop .dkn{font-size:18px;line-height:1.1;margin-bottom:2px}
.dkpop .dklab{display:flex;gap:8px;padding:3px 4px 0}
.dkpop .dklab span{flex:1;text-align:center;font-size:17px}
.dkpop small{display:block;color:var(--mute);font-size:15px;margin-top:6px}
.pilehit.off{cursor:var(--cd)}.pilehit.off:hover{box-shadow:none}
.freedraw{position:absolute;z-index:61;display:block;width:44px;height:48px;background:none;border:0;padding:0;cursor:var(--cp);filter:drop-shadow(0 2px 4px rgba(0,0,0,.65))}
.freedraw img{width:100%;height:100%;object-fit:contain;display:block}
.freedraw .mul{position:absolute;right:-7px;bottom:-4px;font:700 20px Alegreya,serif;color:#f2d27a;text-shadow:0 0 2px #000,0 0 3px #000,0 0 6px #000}
.freedraw.opp{cursor:default;pointer-events:none;font-size:15px;color:inherit;font-family:inherit}
.freedraw.opp.lf{pointer-events:auto;cursor:var(--cp);transition:transform .12s}.freedraw.opp.lf:hover{transform:scale(1.08)}
.freedraw.opp.lf.sel{filter:drop-shadow(0 0 7px #f2d27a) drop-shadow(0 0 3px #f2d27a)}
.freedraw.opp .lfb{font-style:normal;font-size:12px;color:var(--gold)}
/* Panels, Spielerstatus, Händler, Monster */
.panel{position:absolute;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:hidden}
.panel h3{font-size:20px;color:var(--gold);margin-bottom:6px}
.statrow .note{font-size:15px}
.turnflag{position:absolute;text-align:center;font-family:'Alegreya SC',serif;font-size:22px;color:var(--gold);z-index:5}
.turnflag.wait{color:var(--mute)}

/* Spielerstatus: Werte links, Magie-Board rechts */
.sbody{display:flex;gap:8px;align-items:center}.scol{flex:1;min-width:0}
.sbody .bcol{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.sbody .statrow{gap:6px;margin:3px 0}.sbody .statrow img{width:22px;height:22px}.sbody .statrow b{min-width:33px}
.bar.sb{flex:1;min-width:24px;height:9px}
.bd{position:relative;flex:none}.bd img{width:100%;height:100%;display:block}
.rg{position:absolute;border-radius:50%;box-sizing:border-box;pointer-events:none}
.rg.pv{border:2.5px solid #5fe07f;box-shadow:0 0 9px #5fe07faa;background:rgba(95,224,127,.25)}
.pvdn{color:var(--bad);font-weight:700}
.prow{min-height:26px;display:flex;justify-content:center;align-items:center;margin:4px 0}
.pdots{display:inline-flex;gap:8px;align-items:center}
.pdot{width:18px;height:18px;border-radius:50%;display:inline-block;background:radial-gradient(circle,#fff 0 18%,var(--c) 38%,transparent 72%);box-shadow:0 0 10px var(--c)}
.pdot.F{--c:#ff7a3d}.pdot.E{--c:#93c24f}.pdot.W{--c:#52a6f5}
.slotgh{position:absolute;width:128px;height:194px;border:2px dashed #5fe07f;border-radius:12px;background:rgba(95,224,127,.10);pointer-events:none;display:none}.slotgh.on{display:block}
.pvnew{color:var(--good);font-weight:700}
.pvfl{position:absolute;z-index:270;pointer-events:none;color:var(--good);font-weight:700;font-size:18px;background:rgba(14,10,22,.92);border:1px solid var(--good);border-radius:8px;padding:3px 9px;white-space:nowrap}
.rg.on{border:2.5px solid #f2c850;box-shadow:0 0 6px #f2c850aa;background:rgba(242,200,80,.18)}
.lfsel{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;flex-basis:100%}.lfsel .mini{font-size:13px;padding:2px 7px}.mini{font:700 14px Alegreya,serif;padding:2px 8px;border-radius:10px;border:1px solid #8a7a50;background:#2b2b30;color:#d8c9a0;cursor:var(--cp)}.mini.on{background:#e8c35a;color:#2a1a05}
.mr{color:#7fd4ff;font-size:18px;font-weight:700;margin-left:8px;white-space:nowrap;cursor:help}
.mk{color:#c58cf0;letter-spacing:2px;font-size:20px}
.mkimg{width:22px;height:22px;vertical-align:middle;margin-right:2px}.mkimg.off{opacity:.22}
.sbody .statrow .mk{display:flex;flex-wrap:nowrap;gap:1px;white-space:nowrap;margin-left:0}
.sbody .statrow .mk img{width:18px;height:18px}
.lead{display:inline-flex;flex:none;width:0;overflow:hidden;margin-right:-6px;transition:width .28s ease,margin .28s ease}
.sbody.hasup .lead{width:30px;margin-right:0;overflow:visible}
.lead .up{margin:0 6px 0 0}
.sbody .statrow .plcol{margin-left:auto;display:flex}
.pendhdr{float:right;color:var(--gold);font-size:15px;font-weight:400}.pendhdr b{font-size:19px;font-weight:700}

/* Plus-Knöpfe (Upgrade-Punkte ausgeben) */
.up{width:24px;height:26px;padding:0;border:0;background:var(--plus) center/contain no-repeat;cursor:var(--cp);margin-left:4px;flex:none}
.up:hover{background-image:var(--plush)}
.up.mg{background-image:var(--plusg)}.up.mg:hover{background-image:var(--plushg)}
.up.costly{position:relative}
.up{position:relative}
.up.pt.costly::after{background:#7ad78d;color:#0b2a12;box-shadow:0 0 0 1px #0b2a12}
/* Lifeflow: Marker auf dem Brett anwählen */
.mtok.lf{cursor:var(--cp);position:relative;padding:0;transition:transform .12s,box-shadow .12s}
.mtok.lf:hover{transform:scale(1.1)}
.mtok.lf::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed rgba(210,173,79,.6);pointer-events:none}
.mtok.lf.sel{box-shadow:0 0 0 3px #f2d27a,0 0 16px 5px rgba(242,210,122,.9)}
.mtok.lf.sel::after{border:2px solid #f2d27a}
.lfb{position:absolute;right:-10px;top:-10px;min-width:22px;height:18px;padding:0 3px;border-radius:9px;background:#f2d27a;color:#2a1a05;font:700 12px/18px Alegreya,serif;text-align:center;font-style:normal;box-shadow:0 0 0 1px #2a1a05;z-index:3}
.mkb{background:none;border:0;padding:0;margin:0;cursor:var(--cp);position:relative;border-radius:50%;line-height:0;display:block}
.mkb img{display:block}
.mkb.lf::after{content:"";position:absolute;inset:-3px;border:1.5px dashed rgba(210,173,79,.65);border-radius:50%;pointer-events:none}
.mkb.lf:hover img{filter:brightness(1.4)}
.mkb.lf.sel{background:radial-gradient(circle,rgba(242,210,122,.6),transparent 72%)}
.mkb.lf.sel::after{border:2px solid #f2d27a;box-shadow:0 0 8px 2px rgba(242,210,122,.85)}
.mkb.lf.sel img{filter:brightness(1.6) drop-shadow(0 0 3px #f2d27a)}
.lfchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.lfchip{padding:1px 9px;border-radius:11px;background:rgba(242,210,122,.2);border:1px solid #f2d27a;color:#f2d27a;font-size:15px}
.lfsum{margin-top:6px}.lfsum .note{font-size:15px}.lfsum b{color:#f2d27a}
.up.costly::after{content:attr(data-c);position:absolute;right:-5px;top:-6px;min-width:15px;height:15px;border-radius:8px;background:#e8c35a;color:#2a1a05;font:700 12px/15px Alegreya,serif;text-align:center;box-shadow:0 0 0 1px #2a1a05}
.up.off{opacity:.38;cursor:var(--cd);pointer-events:auto}
.up.off:hover{background-image:var(--plus)}
.up.mg.off:hover{background-image:var(--plusg)}
.up.mg{position:absolute;margin:0;z-index:2}
.up.ph{visibility:hidden;pointer-events:none;background:none}
.upgpts{position:absolute;display:flex;align-items:center;gap:2px;color:var(--good);font-size:28px;pointer-events:auto;z-index:70}
.upgpts img{width:34px;height:50px;object-fit:contain}

/* Opfern: Auswahl links, Knopf rechts, zusammen so lang wie die Balken */
.sacbox{flex:1;display:flex;align-items:center;justify-content:space-between;min-width:0}
.sacbox .stepper{flex:none;display:flex;align-items:center;gap:1px;justify-content:flex-start;font-size:16px;color:var(--gold)}
.sacbox .stepper b{min-width:0;color:#fff}
.sacbox .sacbtn{margin:0;padding:0 5px;font-size:13px;line-height:20px}
.arr{background:none;border:0;color:var(--gold);font-size:12px;padding:0 1px;cursor:var(--cp)}.arr:disabled{opacity:.3;cursor:var(--cd)}.arr:hover:not(:disabled){color:#fff}

/* Monster */
.mon{position:absolute;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#2e2e33,#1f1f23);text-align:center;overflow:hidden;display:flex;flex-direction:column}
.mon img.pic{object-fit:contain;display:block;margin:0 auto 2px}
.mon.dead{opacity:.55}
.mon .nm{font-family:'Alegreya SC',serif;font-size:18px}
.mon .sm{font-size:15px;color:var(--mute);line-height:1.2}
.mon .loot{color:var(--gold);font-size:16px}
.mon .btn{margin-top:auto;width:100%;padding:3px 10px;flex:none}
.mon>*{flex:none}
.mon .bar{margin:3px 4px}
.magrow{display:flex;align-items:center;gap:8px;font-size:19px;margin:3px 0}
.magrow .nm{width:70px}

/* Händler */
.vrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid #44444c;border-radius:9px;margin-bottom:5px;cursor:var(--cp);background:rgba(0,0,0,.18)}
.vrow:hover{border-color:var(--gold)}
.vrow.off{opacity:.4;cursor:var(--cd)}.vrow.off:hover{border-color:#44444c}
.stock{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px;margin:6px 0 8px}.stk{display:flex;align-items:center;gap:5px;padding:2px 4px;border:1px solid #44444c;border-radius:7px;background:rgba(0,0,0,.18)}.stk b{font-size:13px;color:var(--gold)}.stk.buy{border-color:var(--gold);box-shadow:0 0 8px rgba(255,205,90,.65),inset 0 0 6px rgba(255,205,90,.3);cursor:var(--cp)}.stk.buy:hover{background:rgba(255,205,90,.16)}.stk.lock{opacity:.55}.stk.out{opacity:.35}.stk.out b{color:#d88}
.thumb{width:30px;height:45px;background-size:100% 100%;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.vrow .plus{color:var(--mute);font-size:16px}
.vrow img.ar{width:26px}

/* Protokoll (Weltphase) */
#log{position:absolute;font-size:15px;color:var(--mute);line-height:1.28;pointer-events:none}
#log div{opacity:.55}#log div:last-child{opacity:1;color:var(--bone)}
#log.logpanel{padding:12px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;text-align:left;color:var(--bone)}
#log.logpanel h3{font-size:20px;color:var(--gold);margin-bottom:6px;flex:none}
#log.logpanel{pointer-events:auto}
#log.logpanel .logl{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--mute) transparent}
#log.logpanel .logl>div:first-child{margin-top:auto}
#log.logpanel .logl div{opacity:.62;padding:2px 0 2px 8px;border-left:2px solid transparent;line-height:1.25}
#log.logpanel .logl div.me{border-left-color:var(--gold)}#log.logpanel .logl div.op{border-left-color:var(--mute)}
#log.logpanel .logl div:last-child{opacity:1}
#log.logpanel .logst{flex:none;color:var(--mute);font-size:15px;line-height:1.3;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}

/* Kopfzeile des Spielerstatus: Name, Tempelfortschritt, Punkte, Siegpunkte (rechtsbündig) */
.hdr{display:flex;align-items:center;gap:8px;width:100%}
.hn{white-space:nowrap}
.hsp{margin-left:auto;font-weight:400;color:var(--mute);font-size:17px;white-space:nowrap}.hsp b{color:var(--gold)}
.pendhdr{float:none;white-space:nowrap;font-size:17px;font-variant-numeric:tabular-nums;color:var(--good)}.pendhdr b{color:#a9efb8}.pendhdr .pvnew{color:#e2ffe8;text-shadow:0 0 6px rgba(120,230,145,.8)}.pendhdr .gneed{color:var(--mute);font-size:14px}
.pendhdr .pl{color:#5fa872}.pendhdr .mx{color:var(--good)}.pendhdr .mx.nw{color:#c4f7cf;text-shadow:0 0 6px rgba(120,230,145,.6)}.pendhdr .mx .w{font-weight:700;font-size:19px}

async function mpOpen(code, host) {

  const on = (t, f) => MP.subs.push(room.on(t, m => { if (!m.sameTab) f(m.data || {}, m); }));

}

function mpSendLog(from) {

  while (i < MP.log.length) {
    const list = []; let size = 0, start = i;

function onAct(d) {
  switch (d.act) {
    case 'newgame': newGame(); break;
    case 'newspec': newGame(true); break;
    case 'specspeed': specSpeed = specSpeed === 1 ? 3 : specSpeed === 3 ? 99 : 1; setFast(); homeMenuDraw(); break;
    case 'home': homeMenu(); break;
    case 'stopen': statsOpen(true); break;
    case 'sndtoggle': Snd.toggle(); Snd.play('ui_click', 0, .8); setTimeout(homeMenuDraw, 350); homeMenuDraw(); break;
    case 'stfight': overlay.innerHTML = fightView(+d.i); break;
    case 'stfightback': overlay.innerHTML = statsView(); break;
    case 'stend': statsOpen(true); stFromMenu = false; stFromEnd = true; break;
    case 'logdl': exportLog({}); break;
    case 'stclose': if (stFromEnd) { stFromEnd = false; showEnd(); } else if (stFromMenu) { stFromMenu = false; homeMenuDraw(); } else { overlay.style.display = 'none'; overlay.innerHTML = ''; pump(); } break;
    case 'stfit': statsFitView(); break;
    case 'stwho': case 'stser': statsToggle(d.act, d.k); break;
    case 'resume': overlay.style.display = 'none'; overlay.innerHTML = ''; pump(); break;
    case 'restart': if (!MP) newGame(SPEC); break;
    case 'leave': clearTimeout(aiTimer); if (MP) { mpLeave(); G = null; started = false; } showStart(); break;
    case 'mphost': mpHost(); break;
    case 'mpjoin': mpJoin(); break;
    case 'mpexit': mpLeave(); showStart(); break;
    case 'deckview': deckView = !deckView; render(); break;
    case 'deckclose': deckView = false; render(); break;
    case 'dismiss': dismissOverlay(); break;
    case 'combat': act({ type: 'combat', elem: d.e }); break;
    case 'vendorres': { const o = M.vendorOffers(G, ME).filter(x => !x.free && x.available && x.result === d.r).sort((x, y) => x.cost.length - y.cost.length)[0]; if (o) act({ type: 'vendor', result: o.result, cost: o.cost }); break; }
    case 'vendor': { const o = M.vendorOffers(G, ME)[+d.i]; if (o) act({ type: 'vendor', result: o.result, cost: o.cost }); break; }
    case 'sacdn': sacN = Math.max(0, sacN - 1); render(); break;
    case 'sacup': sacN = Math.min(4, sacN + 1); render(); break;
    case 'temple': sacN = 0; act({ type: 'temple', amount: +d.n }); break;
    case 'spend': act({ type: 'spend', what: d.w }); break;
    case 'magic': act({ type: 'magic', elem: d.e }); break;
    case 'fd': act({ type: 'fd', slots: [...fdSel] }); fdSel.clear(); break;
    case 'draw': if (canDrawNow()) act({ type: 'draw' }); else if (myTurn()) toast('Jetzt ist kein Nachziehen möglich.'); break;
    case 'freedraw': act({ type: 'freeDraw' }); break;
    case 'attack': act({ type: 'attack' }); break;
    case 'defend': act({ type: 'defend' }); break;
    case 'pass': act({ type: 'pass' }); break;
    case 'recover': act({ type: 'recover' }); break;
    case 'fleeask': fleeAsk = true; render(); break;
    case 'fleeno': fleeAsk = false; render(); break;
    case 'flee': fleeAsk = false; act({ type: 'flee' }); break;
    case 'lfm': {
      const L = lfCtx(); if (!L) break;
      const k = d.k, e = d.e || '', key = e ? k + ':' + e : k, have = lfHave(L.cx, k, e), n = L.picks.filter(x => x === key).length;
      let m = (e || k === 'ot') ? (n + 1 <= Math.min(have, L.lvl) ? n + 1 : 0) : (n > +d.i ? +d.i : +d.i + 1);   // Spiegelstein: einen mehr, nach dem Maximum alle weg; Totenkopf: bis hierhin wählen oder ab hier abwählen

    }

const stView = { auto: true, x0: 0, x1: 1, y0: 0, y1: 4 };   // sichtbarer Ausschnitt in Daten-Einheiten; auto = Ursprung links unten, Achsen dehnen sich mit dem Spiel
const ST = { W: 1000, T: 52, B: 40, L: 44, R: 16, PH: 330 };
function niceStep(span, n) { const raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function statsLimits() {   // Gesamtumfang der Daten: x 0..letzter Messpunkt, y 0..höchster sichtbarer Wert
  const H = G.hist || [], vals = [];
  ST_SERIES.forEach(s => { if (stOn.has(s.chip)) H.forEach(h => { if (stWho.me) vals.push(h.p[ME][s.k]); if (stWho.opp) vals.push(h.p[OPP][s.k]); }); });
  return { xmax: Math.max(1, H.length - 1), ymax: Math.max(4, Math.ceil(Math.max(0, ...vals) / 2) * 2) };
}
function statsFit(a, b, lo, hi, minSpan) { const span = Math.max(minSpan, Math.min(b - a, hi - lo)); a = Math.max(lo, Math.min(a, hi - span)); return [a, a + span]; }
function statsSvg() {
  const H = G.hist || [], N = H.length, { W, T, B, L, R, PH } = ST, ph = T + PH + B, pw = W - L - R, lim = statsLimits();
  if (stView.auto) { stView.x0 = 0; stView.x1 = lim.xmax; stView.y0 = 0; stView.y1 = lim.ymax; }
  else { [stView.x0, stView.x1] = statsFit(stView.x0, stView.x1, 0, lim.xmax, 3); [stView.y0, stView.y1] = statsFit(stView.y0, stView.y1, 0, lim.ymax, 1); }
  const { x0, x1, y0, y1 } = stView, xs = i => L + (i - x0) / (x1 - x0) * pw, ys = v => T + PH - (v - y0) / (y1 - y0) * PH;
  let svg = '<svg id="stsvg" viewBox="0 0 ' + W + ' ' + ph + '" width="' + W + '" height="' + ph + '" style="display:block;max-width:100%;touch-action:none;user-select:none"><defs><clipPath id="stclip"><rect x="' + L + '" y="' + (T - 40) + '" width="' + pw + '" height="' + (PH + 40) + '"/></clipPath></defs>';
  const ystep = niceStep(y1 - y0, 8), xstep = Math.max(1, niceStep(x1 - x0, 14));

  for (let g = Math.ceil(x0 / xstep) * xstep; g <= x1 + 1e-9; g += xstep) svg += '<text x="' + xs(g) + '" y="' + (T + PH + 22) + '" text-anchor="middle" fill="#9a97a6" font-size="14">' + Math.round(g) + '</text>';
  svg += '<text x="' + (L + pw / 2) + '" y="' + (ph - 4) + '" text-anchor="middle" fill="#9a97a6" font-size="14">Züge</text><g clip-path="url(#stclip)">';
  const inView = H.filter((h, i) => i >= x0 - 1 && i <= x1 + 1).length;

    if (e.type === 'showdown') svg += '<g' + hit + '><title>Showdown ' + e.n + ': ' + res + tip + '</title><text x="' + x + '" y="' + (T - 14) + '" text-anchor="middle" fill="#e0b84a" font-size="30">★</text><text x="' + x + '" y="' + (T + 4) + '" text-anchor="middle" fill="' + (e.winner === null ? '#9a97a6' : mine ? '#9be37a' : '#ff6b6b') + '" font-size="13">' + (e.winner === null ? '=' : mine ? 'Sieg' : 'Nied.') + '</text></g>';
    else svg += '<g' + hit + '><title>' + M.NAMES[e.elem] + 'monster Stufe ' + e.stage + ': ' + res + tip + '</title><circle cx="' + x + '" cy="' + (T - 12) + '" r="11" fill="' + ({ F: '#ff7a3d', E: '#93c24f', W: '#52a6f5' }[e.elem] || '#888') + '" stroke="#0a080e" stroke-width="2"/><text x="' + x + '" y="' + (T - 7) + '" text-anchor="middle" fill="#0a080e" font-size="15" font-weight="700">' + (e.winner === null ? '–' : mine ? '✓' : '✗') + '</text></g>';
  });
  ST_SERIES.forEach(s => {
    if (!stOn.has(s.chip)) return;
    [['me', ME, ''], ['opp', OPP, '7 5']].forEach(([key, seat, dash]) => {
      if (!stWho[key]) return;
      const pts = H.map((h, i) => xs(i).toFixed(1) + ',' + ys(h.p[seat][s.k]).toFixed(1));
      if (pts.length > 1) svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + s.col + '" stroke-width="' + (s.thin ? 1.8 : 3.4) + '" stroke-linejoin="round"' + (dash ? ' stroke-dasharray="' + dash + '" opacity=".75"' : '') + '/>';
      else if (pts.length === 1) { const q = pts[0].split(','); svg += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="4" fill="' + s.col + '"/>'; }
      if (inView <= 60) H.forEach((h, i) => { if (i < x0 - 1 || i > x1 + 1) return; svg += '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(h.p[seat][s.k]).toFixed(1) + '" r="3" fill="' + s.col + '"><title>' + s.name + ' (' + (key === 'me' ? 'du' : esc(G.players[OPP].name)) + ') nach Zug ' + i + ': ' + h.p[seat][s.k] + '</title></circle>'; });
    });
  });

}
function statsView() {
  const chip = (on, act, k, label, col) => '<button class="stchip' + (on ? ' on' : '') + '" data-act="' + act + '" data-k="' + k + '"' + (col ? ' style="--c:' + col + '"' : '') + '>' + (col ? '<i></i>' : '') + label + '</button>';
  return '<div class="box stats"><div class="sthead"><h1>Statistik</h1><div><button class="btn" data-act="stfit" title="Achsen wieder automatisch anpassen (Doppelklick ins Diagramm)">Ansicht zurücksetzen</button> <button class="btn" data-act="stclose">Schließen</button></div></div>' +
    '<div class="stchips">' + chip(stWho.me, 'stwho', 'me', 'Du (durchgezogen)') + chip(stWho.opp, 'stwho', 'opp', esc(G.players[OPP].name) + ' (gestrichelt)') + '</div>' +
    '<div class="stchips">' + ST_CHIPS.map(c => chip(stOn.has(c[0]), 'stser', c[0], c[1], c[2])).join('') + '</div><div id="stplot">' + statsSvg() + '</div>' +
    '<div class="note stkey"><span style="color:#e0b84a">★</span> Showdown · <b>●</b> Monsterkampf in der Farbe des Monsters (✓ du gewinnst, ✗ Gegner gewinnt, – ohne Sieger) · <b>Kampf anklicken</b>: Verlauf des Kampfes · dicke Linien: Magiestufe, dünne hellere: Ø Kartenstufe der Farbe · Mausrad: zoomen (über den Achsen nur diese Achse) · ziehen: Ausschnitt verschieben</div></div>';
}
function statsRedraw() { const el = document.getElementById('stplot'); if (el) el.innerHTML = statsSvg(); }
function statsFitView() { stView.auto = true; statsRedraw(); }
// Zoomen und Verschieben (Ereignisse am Overlay, nur solange die Statistik offen ist)
function statsPos(e) { const r = document.getElementById('stsvg').getBoundingClientRect(), k = ST.W / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k }; }
overlay.addEventListener('wheel', e => {
  const sv = document.getElementById('stsvg'); if (!sv || !sv.contains(e.target)) return;
  e.preventDefault();
  const q = statsPos(e), { L, R, T, PH, W } = ST, pw = W - L - R, f = e.deltaY < 0 ? 0.8 : 1.25, lim = statsLimits();
  const onX = q.y > T + PH, onY = q.x < L;
  if (stView.auto) stView.auto = false;
  if (!onY) { const c = stView.x0 + (Math.min(Math.max(q.x, L), W - R) - L) / pw * (stView.x1 - stView.x0); stView.x0 = c - (c - stView.x0) * f; stView.x1 = c + (stView.x1 - c) * f; }
  if (!onX) { const c = stView.y0 + (T + PH - Math.min(Math.max(q.y, T), T + PH)) / PH * (stView.y1 - stView.y0); stView.y0 = c - (c - stView.y0) * f; stView.y1 = c + (stView.y1 - c) * f; }
  statsRedraw();
}, { passive: false });
let stDrag = null;
overlay.addEventListener('pointerdown', e => { const sv = document.getElementById('stsvg'); if (!sv || !sv.contains(e.target) || e.button !== 0 || e.target.closest('[data-act="stfight"]')) return; const q = statsPos(e); stDrag = { x: e.clientX, y: e.clientY, k: q.k, v: Object.assign({}, stView) }; try { sv.setPointerCapture(e.pointerId); } catch (x) { /* egal */ } });
overlay.addEventListener('pointermove', e => {
  if (!stDrag) return;
  const { L, R, PH, W } = ST, pw = W - L - R, dx = (e.clientX - stDrag.x) * stDrag.k, dy = (e.clientY - stDrag.y) * stDrag.k, v = stDrag.v;
  if (Math.abs(dx) + Math.abs(dy) < 3 && stView.auto) return;
  stView.auto = false; stView.x0 = v.x0 - dx / pw * (v.x1 - v.x0); stView.x1 = v.x1 - dx / pw * (v.x1 - v.x0); stView.y0 = v.y0 + dy / PH * (v.y1 - v.y0); stView.y1 = v.y1 + dy / PH * (v.y1 - v.y0);

const stDragEnd = () => { stDrag = null; };
overlay.addEventListener('pointerup', stDragEnd); overlay.addEventListener('pointercancel', stDragEnd);
overlay.addEventListener('dblclick', e => { const sv = document.getElementById('stsvg'); if (sv && sv.contains(e.target)) statsFitView(); });
let stFromMenu = false, stFromEnd = false;   // woher die Statistik geöffnet wurde: Menü oder Endbildschirm (dorthin geht „Zurück“)
function statsOpen(fromMenu) {
  if (!G || !started || (overlay.style.display === 'flex' && !fromMenu)) return;
  stFromMenu = !!fromMenu;
  clearTimeout(aiTimer);   // das Spiel pausiert, solange die Statistik offen ist
  stView.auto = true; overlay.style.display = 'flex'; overlay.className = 'overlay soft'; overlay.innerHTML = statsView();
}
function statsToggle(act, k) {
  if (act === 'stwho') { stWho[k] = !stWho[k]; if (!stWho.me && !stWho.opp) stWho[k === 'me' ? 'opp' : 'me'] = true; }
  else if (stOn.has(k)) { if (stOn.size > 1) stOn.delete(k); } else stOn.add(k);
  overlay.innerHTML = statsView();
}

// Verlauf eines einzelnen Kampfes (HP und Mana beider Seiten nach jedem Schritt, Angriffe und Verteidigungen als Zeichen)
function fightView(i) {
  const h = (G.hist || [])[i], e = h && h.ev, tr = e && e.trace;
  if (!tr) return statsView();
  const lab = k => tr.monster && k === 1 ? tr.names[1] : tr.ids[k] === ME ? 'Du' : tr.names[k], st = tr.steps, n = Math.max(1, st.length - 1);

  for (let g = 0; g <= n + 1e-9; g += xstep) svg += '<text x="' + xs(g) + '" y="' + (T + PH + 22) + '" text-anchor="middle" fill="#9a97a6" font-size="14">' + g + '</text>';
  svg += '<text x="' + (L + pw / 2) + '" y="' + (ph - 4) + '" text-anchor="middle" fill="#9a97a6" font-size="14">Schritte im Kampf</text>';

    svg += '<text x="' + xs(x.t) + '" y="' + (T - 10) + '" text-anchor="middle" fill="' + c + '" font-size="15" font-weight="700"><title>' + lab(x.who) + (x.k === 'A' ? ' greift an: Schaden ' + x.v : ' verteidigt: Block ' + x.v + ' gegen ' + x.b + ', ' + x.left + ' gehen durch') + '</title>' + (x.k === 'A' ? '▲' + x.v : '◆' + x.v) + '</text>';
  });
  [['hp', 0, '#ff5d6c', '', 'HP'], ['hp', 1, '#ff5d6c', '7 5', 'HP'], ['mana', 0, '#6ea8ff', '', 'Mana'], ['mana', 1, '#6ea8ff', '7 5', 'Mana']].forEach(([k, side, col, dash, nm]) => {
    svg += '<polyline points="' + st.map(x => xs(x.t).toFixed(1) + ',' + ys(x[k][side]).toFixed(1)).join(' ') + '" fill="none" stroke="' + col + '" stroke-width="3.4" stroke-linejoin="round"' + (dash ? ' stroke-dasharray="' + dash + '" opacity=".75"' : '') + '/>';
    if (st.length <= 70) st.forEach(x => { svg += '<circle cx="' + xs(x.t).toFixed(1) + '" cy="' + ys(x[k][side]).toFixed(1) + '" r="3" fill="' + col + '"><title>' + nm + ' ' + lab(side) + ' nach Schritt ' + x.t + ': ' + x[k][side] + '</title></circle>'; });

    return '<div><b>' + esc(lab(side)) + '</b>: ' + at.length + ' Angriff' + (at.length === 1 ? '' : 'e') + ' (Schaden ' + at.reduce((a, x) => a + x.v, 0) + ') · ' + df.length + ' Verteidigung' + (df.length === 1 ? '' : 'en') + ' (geblockt ' + df.reduce((a, x) => a + Math.min(x.v, x.b), 0) + ' von ' + df.reduce((a, x) => a + x.b, 0) + ', durchgegangen ' + df.reduce((a, x) => a + x.left, 0) + ') · am Ende ' + last.hp[side] + ' HP, ' + last.mana[side] + ' Mana</div>';

  return '<div class="box stats"><div class="sthead"><h1>' + title + '</h1><div><button class="btn" data-act="stfightback">Zurück zur Statistik</button> <button class="btn" data-act="stclose">Schließen</button></div></div>' +
    '<div class="note" style="margin:4px 0 8px">' + res + ' · ' + (st.length - 1) + ' Schritte · Spielzug ' + i + ' der Partie</div><div id="stplot">' + svg + '</div>' +
    '<div class="note stkey">' + sum(0) + sum(1) + '<div style="margin-top:6px">Rot: HP, Blau: Mana (durchgezogen: ' + esc(lab(0)) + ', gestrichelt: ' + esc(lab(1)) + ') · ▲ Angriff mit Schaden, ◆ Verteidigung mit Block</div></div></div>';
}
/* ---------- Spiellog-Export (jederzeit, auch am Spielende) ---------- */
function buildExport() {

    format: 'magus-spiellog', version: 1, exportiert: new Date().toISOString(),
    hinweis: 'actions = jede ausgeführte Aktion mit Zustand davor (before), Akteur und den zugehörigen Logzeilen (logFrom..logTo, Nummern aus log). Die KI-Spieler sind mit ai=true markiert. Mit seed + rules + first lässt sich die Partie über die Aktionsfolge nachspielen.',
    modus: MP ? 'mehrspieler' : 'gegen-computer', mein_platz: ME,

// Der Export-Knopf sitzt in der Kopfzeile des Logs (siehe render in 26-erde.js)
logEl.addEventListener('click', e => { if (e.target.closest('.logdl')) { e.stopPropagation(); exportLog(e); } });
